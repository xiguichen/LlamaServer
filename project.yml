# XcodeGen project specification.
#
# We generate the .xcodeproj in CI (macOS runner) with `xcodegen generate`.
# This avoids having to hand-maintain a project.pbxproj on Windows.
#
# Prerequisite that CI prepares BEFORE running `xcodegen generate`:
#   vendor/llama.xcframework   (downloaded by scripts/fetch-llama-xcframework.sh)

name: LlamaServer

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  Telegraph:
    url: https://github.com/Building42/Telegraph.git
    from: "0.30.0"

targets:
  LlamaServer:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: LlamaServer
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        # Commit SHA, injected by CI (see .github/workflows/build.yml). Custom key
        # on purpose: CFBundleVersion must stay numeric-ish for the install
        # tooling, and this is read at runtime to identify the deployed build.
        # A stale artifact and the current one are otherwise indistinguishable
        # from the outside — which cost two redeploys on 2026-10-17.
        LlamaServerBuildSHA: "$(LLAMASERVER_BUILD_SHA)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Let users add .gguf models via the Files app / Finder file sharing.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # We are an HTTP *server*; allow local networking prompts.
        NSLocalNetworkUsageDescription: "LlamaServer serves LLM requests to other devices on your local network."
        # Bonjour services trigger the iOS local network permission dialog
        # reliably (without this the dialog may not appear on first launch).
        NSBonjourServices:
          - _http._tcp
        # Keep serving while screen is on; background execution is limited by iOS.
        UIBackgroundModes:
          - audio
    # Unlocks the device's own per-process memory tier (6GiB / 6,442,450,944B on
    # iPhone 17 Pro Max, measured 2026-10-18) instead of the base limit the app
    # gets without it. xnu raises nothing by itself: it takes
    # MAX(base, memorystatus_entitled_max_task_footprint_mb), and that second
    # value is a device-tree constant Apple bakes per model
    # (`entitled_max_task_pmem`), so no SDK or build flag can exceed it.
    # No paid account needed: AltStore 2.3+ (AltSign >= b2c8861793) and Xcode
    # "Personal Team" signing both carry the entitlement over for free Apple ID
    # apps; SideStore does not. Whether it survived the re-sign in the field is
    # logged at init by MemoryLimitProbe.
    # NOTE: xcodebuild cannot ad-hoc sign for the iphoneos SDK, so CI builds
    # unsigned and scripts/package-ipa.sh ad-hoc signs the .app with this
    # entitlements file — embedding the blob in LC_CODE_SIGNATURE, the only
    # place AltSign (ldid::Entitlements) reads from.
    entitlements:
      path: LlamaServer.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.llamaserver
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Overridden on the command line by CI; "dev" marks a local build.
        LLAMASERVER_BUILD_SHA: dev
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: NO
        # Bridging header exposes the C++ MTP shim (LlamaExtShim.cpp) to Swift.
        SWIFT_OBJC_BRIDGING_HEADER: Sources/App/LlamaServer-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: "gnu++17"
        # Unsigned build — re-signing happens later on-device (AltStore/Sideloadly/etc).
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        # Note: llama.framework's modulemap auto-links Metal / Accelerate /
        # Foundation / c++, so no extra OTHER_LDFLAGS are needed.
    dependencies:
      - package: Telegraph
      - framework: vendor/llama.xcframework
        embed: true
        codeSign: false

  LlamaServerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/LlamaServerTests
      - path: Sources/App/ToolCallParser.swift
        createIntermediateGroups: true
      - path: Sources/App/OpenAIModels.swift
        createIntermediateGroups: true
      - path: Sources/App/ToolPrompt.swift
        createIntermediateGroups: true
      - path: Sources/App/ThinkingSwitch.swift
        createIntermediateGroups: true
      - path: Sources/App/LogFetchSpec.swift
        createIntermediateGroups: true
      - path: Sources/App/MtpProbe.swift
        createIntermediateGroups: true
      - path: Sources/App/MtpSpeculator.swift
        createIntermediateGroups: true
      - path: Sources/App/MemoryBudget.swift
        createIntermediateGroups: true
      - path: Sources/App/MemoryLimitProbe.swift
        createIntermediateGroups: true
      - path: Sources/App/UpdateSpec.swift
        createIntermediateGroups: true
      - path: Sources/App/UpdateStore.swift
        createIntermediateGroups: true
      - path: Sources/App/ResponsePolicy.swift
        createIntermediateGroups: true
      - path: Sources/App/KVCacheSpec.swift
        createIntermediateGroups: true
      - path: Sources/App/FileLogger.swift
        createIntermediateGroups: true
      - path: Sources/App/LogRouter.swift
        createIntermediateGroups: true
      - path: Sources/App/LogPanelSpec.swift
        createIntermediateGroups: true
      - path: Sources/App/RecreateTracker.swift
        createIntermediateGroups: true
      - path: Sources/App/ReuseSurvival.swift
        createIntermediateGroups: true
      - path: Sources/App/StartupTimer.swift
      - path: Sources/App/MtpPhaseStats.swift
      - path: Sources/App/PlainStepStats.swift
      - path: Sources/App/PrefillStats.swift
      - path: Sources/App/MtpSpec.swift
        createIntermediateGroups: true
      - path: Sources/App/EngineConfigSpec.swift
        createIntermediateGroups: true
      - path: Sources/App/DecodeRetry.swift
        createIntermediateGroups: true
      - path: Sources/App/NativeLogRing.swift
        createIntermediateGroups: true
    settings:
      base:
        SWIFT_VERSION: "5.0"
        ENABLE_TESTABILITY: YES

schemes:
  LlamaServer:
    build:
      targets:
        LlamaServer: all
        LlamaServerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LlamaServerTests
    archive:
      config: Release

  LlamaServerTests:
    build:
      targets:
        LlamaServerTests: [test]
    test:
      config: Debug
      targets:
        - LlamaServerTests
